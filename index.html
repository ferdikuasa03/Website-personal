<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selamat Datang</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #45c07ce8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .welcome-card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      max-width: 400px;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .btn-masuk {
      display: inline-block;
      text-decoration: none;
      background-color: #2e7d32;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-masuk:hover {
      background-color: #1b5e20;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <h1>Halo!</h1>
    <p>Selamat datang di data diri saya.</p>
    <br>
    <a href="profil.html" class="btn-masuk">Lihat Profil Saya</a>
  </div>

</body>
</html>
